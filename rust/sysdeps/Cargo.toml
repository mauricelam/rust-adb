[package]
name = "sysdeps"
version = "0.1.0"
edition = "2021"

[dependencies]
hostname = "0.4"
libc = "0.2"
users = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52.0", features = [
    "Win32_System_Environment",
    "Win32_System_SystemInformation",
    "Win32_Networking_WinSock",
    "Win32_Foundation"
] }

[dev-dependencies]
serial_test = "3"
tempfile = "3"

[lints]
workspace = true
