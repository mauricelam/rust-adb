[package]
name = "sysdeps"
version = "0.1.0"
edition = "2021"

[dependencies]
hostname = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
users = "0.11"

[target.'cfg(windows)'.dependencies]
libc = "0.2"
windows-sys = { version = "0.52.0", features = ["Win32_Networking_WinSock", "Win32_Foundation", "Win32_System_IO"] }

[dev-dependencies]
serial_test = "3"
tempfile = "3"
