[package]
name = "adb-sockets"
version = "0.1.0"
edition = "2021"

[dependencies]
adb-protocol = { path = "../adb-protocol" }
adb-types = { path = "../adb-types" }
fdevent = { path = "../fdevent" }
adb_io = { path = "../adb_io" }
sysdeps = { path = "../sysdeps" }
anyhow = "1.0.75"
thiserror = "1.0.44"
bytes = "1"
log = "0.4.20"
mio = { version = "0.8.11", features = ["os-poll", "net", "os-ext"] }
[target.'cfg(unix)'.dependencies]
nix = { version = "0.27.1", features = ["fs", "socket"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52.0", features = ["Win32_Networking_WinSock", "Win32_Storage_FileSystem"] }

[dev-dependencies]
env_logger = "0.10.0"
tempfile = "3.8.0"
