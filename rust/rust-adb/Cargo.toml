[package]
name = "rust-adb"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
thiserror = "1.0"
adb-protocol = { path = "../adb-protocol" }
adb-services = { path = "../adb-services" }
adb-transport = { path = "../adb-transport" }
adb-utils = { path = "../adb-utils" }
adb-sockets = { path = "../adb-sockets" }
adb_io = { path = "../adb_io" }
adb-types = { path = "../adb-types" }
adb-socket-spec = { path = "../socket-spec" }
sysdeps = { path = "../sysdeps" }
bytes = "1.0"
libc = "0.2"
