[package]
name = "adb-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
adb-client = { path = "../adb-client" }
adb-proto = { path = "../adb-proto" }
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "net"] }
tokio-stream = "0.1"

[[bin]]
name = "adb"
path = "src/main.rs"
