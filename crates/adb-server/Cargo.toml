[package]
name = "adb-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
adb-proto = { path = "../adb-proto" }
adb-auth = { path = "../adb-auth" }
adb-transport = { path = "../adb-transport" }
parking_lot = "0.12"
thiserror = "2"
tokio = { version = "1", features = ["sync", "macros", "rt"] }

[dev-dependencies]
rand = "0.8"
rsa = { version = "0.9.10" }
tokio = { version = "1", features = ["full"] }
