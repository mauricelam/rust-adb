[package]
name = "adb-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
adb-proto = { path = "../adb-proto" }
tokio = { version = "1", features = ["net", "io-util", "rt", "rt-multi-thread", "macros", "sync", "process", "fs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
compat = { path = "../../tests/compat" }
mock-adbd = { path = "../../tools/mock-adbd" }
temp-env = "0.3"
