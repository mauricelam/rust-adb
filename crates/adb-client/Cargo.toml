[package]
name = "adb-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
adb-proto = { path = "../adb-proto" }
async-stream = "0.3"
bytes = "1"
tokio = { version = "1", features = ["net", "io-util", "rt", "rt-multi-thread", "macros", "sync", "process", "fs", "signal", "io-std"] }
tokio-stream = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Pipes", "Win32_Security", "Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
adb-cli = { path = "../adb-cli" }
compat = { path = "../../tests/compat" }
mock-adbd = { path = "../../tools/mock-adbd" }
temp-env = "0.3"
tempfile = "3"
