name: cargo build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-ubuntu:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Run tests
      run: cargo test --verbose
      working-directory: test/client-server-test

  integration-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
    - name: List files for debugging
      run: |
        pwd
        ls -F
        ls -R test/
    - name: Run integration test
      env:
        ADB_BINARY: ${{ github.workspace }}/binaries/linux/adb
        RUST_ADB_BINARY: ${{ github.workspace }}/binaries/linux/adb # Placeholder until Rust binary is available
      run: pytest test/rust_adb_integration_test.py

  rust-integration-test:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Run Rust Integration Test
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        script: cd test/emulator-test && cargo test --verbose
