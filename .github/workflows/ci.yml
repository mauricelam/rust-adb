name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set ADB_REFERENCE (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x binaries/linux/adb
          echo "ADB_REFERENCE=$(pwd)/binaries/linux/adb" >> $GITHUB_ENV

      - name: Set ADB_REFERENCE (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x binaries/mac/adb
          echo "ADB_REFERENCE=$(pwd)/binaries/mac/adb" >> $GITHUB_ENV

      - name: Set ADB_REFERENCE (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $adbPath = (Resolve-Path "binaries/windows/adb.exe").Path -replace '\\', '/'
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "ADB_REFERENCE=$adbPath`n", [System.Text.UTF8Encoding]::new($false))

      - name: Verify reference ADB version
        shell: bash
        run: |
          "$ADB_REFERENCE" version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy check
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace
