name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Fetch reference ADB (Unix)
        if: runner.os != 'Windows'
        run: |
          ADB_PATH=$(./scripts/fetch-reference-adb.sh)
          echo "ADB_REFERENCE=$ADB_PATH" >> $GITHUB_ENV

      - name: Fetch reference ADB (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ADB_PATH = .\scripts\fetch-reference-adb.ps1
          Add-Content -Path $env:GITHUB_ENV -Value "ADB_REFERENCE=$ADB_PATH"

      - name: Verify reference ADB version (Unix)
        if: runner.os != 'Windows'
        run: |
          "$ADB_REFERENCE" version

      - name: Verify reference ADB version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:ADB_REFERENCE" version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy check
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace
