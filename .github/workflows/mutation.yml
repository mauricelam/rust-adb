name: Mutation Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TEST_THREADS: 1

jobs:
  mutation-check:
    name: Run Mutation Suite (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install C++ build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake \
            ninja-build \
            libfmt-dev \
            libprotobuf-dev \
            protobuf-compiler \
            libbrotli-dev \
            liblz4-dev \
            libpcre2-dev \
            libzstd-dev \
            zlib1g-dev \
            libusb-1.0-0-dev \
            libgtest-dev

      - name: Cache C++ build assets
        uses: actions/cache@v4
        with:
          path: target/cpp-build/dl/
          key: ${{ runner.os }}-cpp-build-dl-${{ hashFiles('.gitmodules') }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Make scripts executable
        run: |
          chmod +x scripts/build-cpp-adb.sh
          chmod +x mutation/run.sh

      - name: Run mutation testing suite
        run: |
          ./mutation/run.sh

      - name: Upload mutation results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-results
          path: mutation/results.csv

      - name: Check mutation kill rate threshold
        shell: bash
        run: |
          DECISIONS_FILE="docs/decisions.md"
          RESULTS_FILE="mutation/results.csv"

          if [[ ! -f "$DECISIONS_FILE" ]]; then
            echo "Error: Decisions file $DECISIONS_FILE not found!"
            exit 1
          fi

          if [[ ! -f "$RESULTS_FILE" ]]; then
            echo "Error: Results file $RESULTS_FILE not found!"
            exit 1
          fi

          # Extract threshold percentage from docs/decisions.md
          THRESHOLD=$(grep -oP 'Mutation kill-rate threshold:\s*\K[0-9]+(?=%)' "$DECISIONS_FILE" || true)

          if [[ -z "$THRESHOLD" ]]; then
            echo "Error: Could not parse mutation kill-rate threshold from $DECISIONS_FILE! Expected format 'Mutation kill-rate threshold: <N>%'"
            exit 1
          fi

          echo "Parsed mutation kill-rate threshold from $DECISIONS_FILE: ${THRESHOLD}%"

          # Count statuses from results.csv (header: patch,status)
          KILLED_MUTANTS=$(grep -c ",killed" "$RESULTS_FILE" || true)
          SURVIVED_MUTANTS=$(grep -c ",survived" "$RESULTS_FILE" || true)
          EQUIVALENT_MUTANTS=$(grep -c ",equivalent" "$RESULTS_FILE" || true)

          EVALUATED_TOTAL=$(( KILLED_MUTANTS + SURVIVED_MUTANTS ))

          echo "Killed mutants: $KILLED_MUTANTS"
          echo "Survived mutants: $SURVIVED_MUTANTS"
          echo "Equivalent mutants (excluded from denominator): $EQUIVALENT_MUTANTS"
          echo "Total evaluated mutants (killed + survived): $EVALUATED_TOTAL"

          if [[ "$EVALUATED_TOTAL" -eq 0 ]]; then
            echo "Error: No evaluated mutants found in $RESULTS_FILE!"
            exit 1
          fi

          # Calculate kill rate percentage: (KILLED * 100) / EVALUATED_TOTAL
          KILL_RATE_PCT=$(( (KILLED_MUTANTS * 100) / EVALUATED_TOTAL ))

          echo "Calculated kill rate: ${KILL_RATE_PCT}% ($KILLED_MUTANTS / $EVALUATED_TOTAL)"

          if [[ "$KILL_RATE_PCT" -lt "$THRESHOLD" ]]; then
            echo "Error: Mutation kill rate ${KILL_RATE_PCT}% is below the required threshold of ${THRESHOLD}%!"
            exit 1
          fi

          echo "Mutation check passed: ${KILL_RATE_PCT}% kill rate meets or exceeds the ${THRESHOLD}% threshold."
