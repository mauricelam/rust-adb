name: Fuzz Testing

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz Targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Nightly Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Run fuzz_header target
        run: |
          cd fuzz
          cargo +nightly fuzz run fuzz_header -- -max_total_time=30

      - name: Run fuzz_smart_socket_reply target
        run: |
          cd fuzz
          cargo +nightly fuzz run fuzz_smart_socket_reply -- -max_total_time=30

      - name: Upload crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
